# main 브랜치에 올라오면 자동으로 Cloudflare Pages 에 배포합니다. (AI 호출 없음, 무료)
# 필요한 값(GitHub 저장소 Settings > Secrets and variables > Actions 에 등록):
#   CLOUDFLARE_API_TOKEN  : Cloudflare Pages 편집 권한이 있는 API 토큰
#   CLOUDFLARE_ACCOUNT_ID : Cloudflare 계정 ID
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "watcher/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 배포용 폴더 만들기 (계약 데이터 제외)
        run: python scripts/make_dist.py
      - name: Cloudflare Pages 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy --project-name purchase-contract-dashboard --branch main
