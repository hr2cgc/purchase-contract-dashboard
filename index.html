<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>매입 계약 진행 현황</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  /* 레이아웃: 상단 남색 밴드(제목 + 상태 필터 타일) 아래에 담당 PM 필터와 계약 카드 목록.
     카드 하나에 업체, 담당, 다음 할 일, 진행 막대, 종료일까지 모아 둠 */
  :root {
    --bg: #F3F5F8;
    --surface: #FFFFFF;
    --text: #141B26;
    --text-2: #5C6675;
    --line: #E2E6EC;
    --band: #12233F;
    --band-text: #FFFFFF;
    --band-2: #A9B7CE;
    --tile: rgba(255,255,255,.08);
    --tile-on: #FFFFFF;
    --tile-on-text: #12233F;
    --ctl: #FFFFFF;
    --ctl-on: #12233F;
    --ctl-on-text: #FFFFFF;
    --urgent: #C62828; --urgent-soft: #FDEBEB;
    --wait: #9A5B00;   --wait-soft: #FFF1D6;
    --mine: #1D5FD1;   --mine-soft: #E6EFFD;
    --soon: #3F4C5E;   --soon-soft: #E9EDF2;
    --done: #1D5FD1;
    --sub: #8DB1F0;
    --empty: #C9D0DA;
    --font: "Noto Sans KR", "Pretendard Variable", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0E1319; --surface: #171D26; --text: #E8ECF1; --text-2: #9AA5B4; --line: #262F3B;
      --band: #16233A; --band-2: #9FB0C9;
      --ctl: #171D26; --ctl-on: #E8ECF1; --ctl-on-text: #0E1319;
      --urgent: #FF8F86; --urgent-soft: #3A1E20;
      --wait: #F2BE6B;   --wait-soft: #38290F;
      --mine: #8DB4FF;   --mine-soft: #1C2A44;
      --soon: #B5BEC8;   --soon-soft: #262D35;
      --done: #6B9BFF; --sub: #3D5A94; --empty: #3A4452;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0E1319; --surface: #171D26; --text: #E8ECF1; --text-2: #9AA5B4; --line: #262F3B;
    --band: #16233A; --band-2: #9FB0C9;
    --ctl: #171D26; --ctl-on: #E8ECF1; --ctl-on-text: #0E1319;
    --urgent: #FF8F86; --urgent-soft: #3A1E20;
    --wait: #F2BE6B;   --wait-soft: #38290F;
    --mine: #8DB4FF;   --mine-soft: #1C2A44;
    --soon: #B5BEC8;   --soon-soft: #262D35;
    --done: #6B9BFF; --sub: #3D5A94; --empty: #3A4452;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 14.5px/1.55 var(--font); }
  .gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .in { max-width: 860px; margin: 0 auto; }

  /* ---------- 상단 밴드 ---------- */
  .band { background: var(--bg); color: var(--text); padding-block: 28px 4px; }
  .band h1 { margin: 0; font-size: 24px; line-height: 1.25; font-weight: 900; letter-spacing: -0.02em; }
  .band .meta { margin-top: 4px; color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; }
  .tiles { margin-top: 18px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .tile {
    appearance: none; border: 1px solid transparent; background: var(--tile); color: var(--band-text);
    border-radius: 10px; padding: 10px 12px; text-align: left; cursor: pointer; font: inherit; min-width: 0;
  }
  .tile:hover { border-color: rgba(255,255,255,.35); }
  .tile .k { display: block; font-size: 12.5px; color: var(--band-2); white-space: nowrap; }
  .tile .v { display: block; margin-top: 2px; font-size: 26px; line-height: 1.1; font-weight: 900; font-variant-numeric: tabular-nums; }
  .tile[aria-pressed="true"] { background: var(--tile-on); color: var(--tile-on-text); }
  .tile[aria-pressed="true"] .k { color: #4B5870; }
  .tile.u .v { color: #FF9C93; }
  .tile.u[aria-pressed="true"] .v { color: #C62828; }
  .tile:focus-visible, .seg button:focus-visible, .view button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--mine); outline-offset: 2px; }
  .band .tile:focus-visible { outline-color: #fff; }

  /* ---------- 필터줄 ---------- */
  .bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding-block: 16px 4px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button, .view button {
    appearance: none; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--ctl); color: var(--text);
  }
  .seg button[aria-pressed="true"], .view button[aria-pressed="true"] { background: var(--ctl-on); color: var(--ctl-on-text); border-color: var(--ctl-on); font-weight: 700; }
  .seg button small { color: var(--text-2); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .seg button[aria-pressed="true"] small { color: inherit; opacity: .7; }
  .view { display: flex; gap: 6px; margin-left: auto; }
  input[type=search] {
    height: 32px; width: 220px; max-width: 100%; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--ctl); color: var(--text); font: inherit; font-size: 13px;
  }
  select {
    height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--ctl); color: var(--text); font: inherit; font-size: 13px; min-width: 130px; max-width: 100%;
  }
  #projSel { width: 300px; }
  @media (max-width: 640px) { #projSel, #pmSel { width: 100%; } }
  input[type=search]::placeholder { color: var(--text-2); }

  /* ---------- 목록 ---------- */
  section { margin-top: 26px; }
  .sh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .sh h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .sh .n { font-size: 12.5px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--soon-soft); color: var(--soon); font-variant-numeric: tabular-nums; }
  .sh .d { flex-basis: 100%; color: var(--text-2); font-size: 12.5px; margin-top: -4px; }
  .sh.u .n { background: var(--urgent-soft); color: var(--urgent); }
  .sh.w .n { background: var(--wait-soft); color: var(--wait); }
  .sh.m .n { background: var(--mine-soft); color: var(--mine); }

  .cards { display: grid; gap: 8px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
  .card { cursor: pointer; }
  .card:hover { border-color: var(--text-2); }
  .card:focus-visible { outline: 2px solid var(--mine); outline-offset: 2px; }

  /* 상세 팝업: 엑셀 시트처럼 그룹 머리글 + 열 이름 + 값 */
  .ov { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 24, .55); display: flex; align-items: center; justify-content: center;
        padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
  .modal { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 12px; width: min(1180px, 100%); max-height: 100%; display: flex; flex-direction: column; min-width: 0; }
  .mh { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .mt { min-width: 0; overflow-wrap: anywhere; font-weight: 700; font-size: 15.5px; }
  .mt span { display: block; font-weight: 400; font-size: 13px; color: var(--text-2); }
  .mx { appearance: none; flex: none; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--ctl); color: var(--text); font-size: 18px; line-height: 1; cursor: pointer; }
  .tw { overflow: auto; padding: 16px; }
  table.xl { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  table.xl th, table.xl td { border: 1px solid var(--line); padding: 7px 8px; vertical-align: top; text-align: center; }
  table.xl td { white-space: nowrap; }
  table.xl thead tr:nth-child(2) th { font-size: 12px; line-height: 1.35; }
  table.xl thead tr:first-child th { background: var(--soon-soft); color: var(--text); font-weight: 700; }
  table.xl thead tr:nth-child(2) th { background: var(--bg); color: var(--text-2); font-weight: 500; }
  table.xl td.l { text-align: left; white-space: normal; min-width: 150px; max-width: 280px; overflow-wrap: anywhere; }
  table.xl td.x { color: var(--urgent); font-weight: 700; }
  table.xl td.o { font-weight: 700; }
  table.xl td.e { color: var(--text-2); }
  .top { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
  .id { min-width: 0; }
  .vendor { font-weight: 700; font-size: 15.5px; }
  .pm { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 99px; background: var(--soon-soft); color: var(--soon); font-size: 12px; font-weight: 500; vertical-align: 1px; }
  .cname { color: var(--text); overflow-wrap: anywhere; }
  .proj { color: var(--text-2); font-size: 12.5px; overflow-wrap: anywhere; }
  .due { text-align: right; flex: none; font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .due b { display: block; font-size: 13px; color: var(--text); font-weight: 700; }
  .due.hot b { color: var(--urgent); }

  .next { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
  .pill { flex: none; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 6px; }
  .urgent .pill { background: var(--urgent-soft); color: var(--urgent); }
  .wait .pill { background: var(--wait-soft); color: var(--wait); }
  .mine .pill { background: var(--mine-soft); color: var(--mine); }
  .soon .pill, .none .pill { background: var(--soon-soft); color: var(--soon); }
  .act { font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
  .more { color: var(--text-2); font-size: 13px; overflow-wrap: anywhere; }

  .prog { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: flex-end; }
  .cl { display: grid; gap: 3px; }
  .segs { display: flex; gap: 3px; }
  .s { width: 18px; height: 7px; border-radius: 2px; background: var(--empty); }
  .s.o { background: var(--done); }
  .s.b { background: var(--sub); }
  .s.x { background: var(--urgent); }
  .cl span { font-size: 11px; color: var(--text-2); }
  .ok { margin-left: auto; font-size: 12px; color: var(--text-2); }

  .proj-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .proj-head h2 { margin: 0; font-size: 15.5px; font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
  .proj-head span { color: var(--text-2); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  details > summary { cursor: pointer; font-weight: 700; font-size: 16px; padding: 4px 0; }
  details .cards { margin-top: 10px; }
  .empty { padding: 32px 0; text-align: center; color: var(--text-2); }
  .legend { margin-top: 34px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--text-2); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding-bottom: 8px; }
  .legend i { display: inline-block; width: 14px; height: 7px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }

  @media (max-width: 640px) {
    .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .view { margin-left: 0; }
    input[type=search] { width: 100%; }
    .band h1 { font-size: 21px; }
    .top { flex-direction: column; gap: 4px; }
    .due { text-align: left; }
    .due b { display: inline; margin-right: 6px; }
  }
</style>
</head>
<body>

<div class="band gut"><div class="in">
  <h1>매입 계약 진행 현황</h1>
  <div class="meta">기준일 <span id="today"></span> · 엑셀 반영일 <span id="updated"></span><span id="syncMeta" hidden> · <span id="syncState"></span></span></div>
</div></div>

<div class="gut"><div class="in">
  <div class="bar">
    <select id="projSel" aria-label="사업명"></select>
    <select id="pmSel" aria-label="담당 PM"></select>
    <input type="search" id="q" placeholder="업체 · 계약명 · 사업명 검색" aria-label="검색">
  </div>
  <div id="out"></div>
</div></div>

<div class="ov" id="ov" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mh"><div class="mt" id="mt"></div><button type="button" class="mx" id="mx" aria-label="닫기">×</button></div>
    <div class="tw" id="tw"></div>
  </div>
</div>

<script src="config.js" onerror="void 0"></script>
<script src="data.js"></script>
<script>
(function () {
  var DATA = window.CONTRACTS || [];
  var T = new Date(); T.setHours(0, 0, 0, 0);
  function parse(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function days(d) { return Math.round((d - T) / 86400000); }
  function md(s) { var d = parse(s); return d ? (d.getMonth() + 1) + '/' + d.getDate() : ''; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ok(v) { return v === 'O' || v === '대체'; }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  document.getElementById('today').textContent = T.getFullYear() + '-' + pad(T.getMonth() + 1) + '-' + pad(T.getDate());
  document.getElementById('updated').textContent = window.DATA_UPDATED || '-';

  var STEPS = ['legal', 'approval', 'send', 'receive', 'bond'];
  var NEXT = ['법무검토 요청', '계약 품의', '계약서 송부', '계약서 회수', '계약보증증권 받기'];
  var XNAME = { legal: '법무검토', approval: '계약 품의', send: '계약서 송부', receive: '계약서 회수', bond: '계약보증증권', adv_bond: '선금보증증권', adv_tax: '선금 세금계산서', adv_appr: '선금 집행 품의', bal_tax: '잔금 세금계산서', bal_appr: '잔금 집행 품의' };
  var LABEL = { legal: '법무검토 요청', approval: '계약 품의', send: '계약서 송부', receive: '계약서 회수', bond: '계약보증증권', adv_bond: '선금보증증권', adv_tax: '선금 세금계산서', adv_appr: '선금 집행 품의', bal_tax: '잔금 세금계산서', bal_appr: '잔금 집행 품의' };

  function analyze(r) {
    var note = r.note || '', end = parse(r.end), adv = parse(r.adv_date);
    var urgent = [], wait = [], mine = [], soon = [], used = false;
    if (/홀딩/.test(note)) return { g: 'none', text: '홀딩 중', sub: '' };
    if (/실제 수행하는 계약 아님/.test(note)) return { g: 'none', text: '실제 수행하는 계약 아님', sub: '목록에서 정리해도 되는지 확인' };
    Object.keys(XNAME).forEach(function (k) { if (r[k] === 'X') urgent.push(XNAME[k] + ' 문제'); });
    var last = -1; STEPS.forEach(function (k, i) { if (ok(r[k])) last = i; });
    var started = last >= 0 || ok(r.adv_tax) || ok(r.adv_appr);
    if (end && started && days(end) < 0 && !ok(r.bal_appr)) urgent.push('종료일 ' + (-days(end)) + '일 지남 · 잔금 처리 확인');
    if (adv && days(adv) >= 0 && days(adv) <= 7) urgent.push('선금 집행 ' + (days(adv) === 0 ? '오늘' : 'D-' + days(adv)) + ' (' + md(r.adv_date) + ')');
    if (/거부/.test(note) && !urgent.length) { wait.push('업체가 거부함 · 협의 필요'); used = true; }
    else if (/변경 계약 품의/.test(note)) { mine.push(/진행중/.test(note) ? '변경 계약 품의 마무리 후 계약서 송부' : '변경 계약 품의'); used = true; }
    else if (last < 4) { if (last === 2) wait.push('계약서 회수 대기'); else mine.push(NEXT[last + 1]); }
    else if (ok(r.adv_bond) && !(ok(r.adv_tax) && ok(r.adv_appr))) mine.push('선금 세금계산서 · 집행 품의');
    if (last === 4 && ok(r.adv_appr) && !ok(r.bal_appr) && end && days(end) >= 0 && days(end) <= 21)
      soon.push('잔금 세금계산서 · 집행 품의 준비');
    var g = urgent.length ? 'urgent' : wait.length ? 'wait' : mine.length ? 'mine' : soon.length ? 'soon' : 'none';
    var list = urgent.concat(wait, mine, soon);
    var sub = (note && !used) ? note : '';
    return { g: g, text: list.length ? list[0] : '지금 할 일 없음', sub: sub };
  }

  var ROWS = [], PMS = [], optsDirty = true;
  function setData(rows) {
    ROWS = (rows || []).map(function (r, i) { var a = analyze(r); a.r = r; a.i = i; a.done = ok(r.bond) && !!r.bond; return a; });
    PMS = []; ROWS.forEach(function (a) { if (a.r.pm && PMS.indexOf(a.r.pm) < 0) PMS.push(a.r.pm); });
    optsDirty = true;
  }
  setData(DATA);

  var GROUPS = [
    { key: 'urgent', cls: 'u', tile: '확인', title: '먼저 확인할 것', pill: '확인', desc: '문제 표시가 있거나, 종료일이 지났거나, 선금 집행이 일주일 안인 건' },
    { key: 'wait', cls: 'w', tile: '회신 대기', title: '상대 회신을 기다리는 중', pill: '대기', desc: '계약서 회수 대기, 업체 협의' },
    { key: 'mine', cls: 'm', tile: '처리 필요', title: '다음에 처리할 것', pill: '처리', desc: '우리 쪽에서 처리해야 다음 단계로 넘어가는 건' },
    { key: 'soon', cls: '', tile: '곧 잔금', title: '곧 잔금 단계', pill: '예정', desc: '선금까지 끝났고 종료일이 3주 안인 건' },
    { key: 'none', cls: '', tile: '해당 없음', title: '지금은 할 일 없음', pill: '참고', desc: '' }
  ];
  var syncErr = '';
  var S = { pm: '', proj: '', q: '', grp: 'all', view: 'proj' };

  function seg(r, k) {
    var v = r[k], c = v === 'O' ? 'o' : v === '대체' ? 'b' : v === 'X' ? 'x' : '';
    var t = LABEL[k] + ': ' + (v === 'O' ? '완료' : v === '대체' ? '각서 등으로 대체' : v === 'X' ? '문제' : '아직');
    return '<i class="s ' + c + '" title="' + esc(t) + '"></i>';
  }
  function cluster(r, keys, name) { return '<div class="cl"><div class="segs">' + keys.map(function (k) { return seg(r, k); }).join('') + '</div><span>' + name + '</span></div>'; }

  function card(a) {
    var r = a.r, e = parse(r.end), d = e ? days(e) : null;
    var hot = d !== null && d <= 14 && a.g !== 'none';
    var dtxt = d === null ? '' : d < 0 ? (-d) + '일 지남' : d === 0 ? '오늘' : 'D-' + d;
    return '<article class="card ' + a.g + '" data-i="' + a.i + '" tabindex="0" role="button" aria-label="' + esc(r.vendor + ' 상세 보기') + '">' +
      '<div class="top"><div class="id"><div><span class="vendor">' + esc(r.vendor) + '</span><span class="pm">' + esc(r.pm) + '</span></div>' +
      '<div class="cname">' + esc(r.name) + '</div>' + (S.view === 'todo' ? '<div class="proj">' + esc(r.project) + '</div>' : '') + '</div>' +
      '<div class="due' + (hot ? ' hot' : '') + '">' + (e ? '<b>종료 ' + md(r.end) + '</b>' + dtxt : '<b>기간 미정</b>') + '</div></div>' +
      '<div class="next"><span class="act">' + esc(a.text) + '</span></div>' +
      (a.sub ? '<div class="more">' + esc(a.sub) + '</div>' : '') + '</article>';
  }
  function key(a) { var e = parse(a.r.end); return e ? e.getTime() : 9e15; }

  function render() {
    var base = ROWS.filter(function (a) {
      if (S.pm && a.r.pm !== S.pm) return false;
      if (S.proj && a.r.project !== S.proj) return false;
      if (S.q && (a.r.vendor + ' ' + a.r.name + ' ' + a.r.project + ' ' + a.r.note).toLowerCase().indexOf(S.q) < 0) return false;
      return true;
    });
    var counts = {}; GROUPS.forEach(function (g) { counts[g.key] = base.filter(function (a) { return a.g === g.key; }).length; });

    var psel = document.getElementById('projSel'), sel = document.getElementById('pmSel');
    if (optsDirty) {
      var projs = []; ROWS.forEach(function (a) { if (projs.indexOf(a.r.project) < 0) projs.push(a.r.project); });
      if (S.proj && projs.indexOf(S.proj) < 0) S.proj = '';
      if (S.pm && PMS.indexOf(S.pm) < 0) S.pm = '';
      psel.innerHTML = '<option value="">사업명 전체</option>' + projs.map(function (p) { return '<option value="' + esc(p) + '">' + esc(p) + '</option>'; }).join('');
      sel.innerHTML = '<option value="">담당 PM 전체</option>' + PMS.map(function (p) { return '<option value="' + esc(p) + '">' + esc(p) + '</option>'; }).join('');
      psel.value = S.proj; sel.value = S.pm; optsDirty = false;
    }

    var shown = base.filter(function (a) { return S.grp === 'all' || a.g === S.grp; });
    var html = '';
    if (!ROWS.length) html = '<div class="empty">' + (window.SYNC_URL ? (syncErr ? esc(syncErr) : '데이터를 불러오는 중입니다.') : '표시할 계약이 없습니다.') + '</div>';
    else if (!shown.length) html = '<div class="empty">조건에 맞는 계약이 없습니다.</div>';
    else {
      var order = [], map = {};
      shown.forEach(function (a) { if (!map[a.r.project]) { map[a.r.project] = []; order.push(a.r.project); } map[a.r.project].push(a); });
      order.forEach(function (p) {
        html += '<section><div class="proj-head"><h2>' + esc(p) + '</h2><span>' + map[p].length + '건</span></div><div class="cards">' + map[p].map(card).join('') + '</div></section>';
      });
    }
    document.getElementById('out').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('#viewSeg button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === S.view)); });
  }

  document.getElementById('pmSel').addEventListener('change', function (e) { S.pm = e.target.value; render(); });
  document.getElementById('projSel').addEventListener('change', function (e) { S.proj = e.target.value; render(); });
  document.getElementById('q').addEventListener('input', function (e) { S.q = e.target.value.trim().toLowerCase(); render(); });
  // ---------- 상세 팝업 (엑셀과 같은 열 구성) ----------
  var KEYS = ['project', 'vendor', 'name', 'pm', 'start', 'end', 'legal', 'approval', 'send', 'receive', 'bond', 'adv_bond', 'adv_tax', 'adv_appr', 'adv_date', 'bal_tax', 'bal_appr', 'bal_date', 'note'];
  var NAMES = ['사업명', '업체명', '계약명', '담당 PM', '계약 시작일', '계약 종료일', '법무검토 요청', '계약 품의', '계약서 송부', '계약서 회수', '계약보증증권', '선금보증증권', '세금계산서 발행', '자금집행 품의', '집행(예정)일', '세금계산서 발행', '자금집행 품의', '집행(예정)일', '비고'];
  var GRP = [['기본 정보', 4], ['계약 단계', 7], ['선금 단계', 4], ['잔금 단계', 3], ['기타', 1]];
  var LONG = { project: 1, name: 1, note: 1 };
  var ov = document.getElementById('ov'), lastFocus = null;
  function openModal(i) {
    var r = ROWS[i] && ROWS[i].r; if (!r) return;
    document.getElementById('mt').innerHTML = esc(r.vendor) + '<span>' + esc(r.name) + '</span>';
    var h = '<table class="xl"><thead><tr>' + GRP.map(function (g) { return '<th colspan="' + g[1] + '">' + g[0] + '</th>'; }).join('') + '</tr><tr>' +
      NAMES.map(function (n) { return '<th>' + n + '</th>'; }).join('') + '</tr></thead><tbody><tr>' +
      KEYS.map(function (k) {
        var v = r[k] == null ? '' : r[k], c = LONG[k] ? 'l' : '';
        if (v === '대체') v = '각서 대체';
        if (v === 'X') c += ' x'; else if (v === 'O') c += ' o';
        return '<td class="' + c + '">' + esc(v) + '</td>';
      }).join('') + '</tr></tbody></table>';
    document.getElementById('tw').innerHTML = h;
    lastFocus = document.activeElement;
    ov.hidden = false; document.body.style.overflow = 'hidden';
    document.getElementById('mx').focus();
  }
  function closeModal() {
    if (ov.hidden) return;
    ov.hidden = true; document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  var out = document.getElementById('out');
  out.addEventListener('click', function (e) { var c = e.target.closest('.card'); if (c) openModal(+c.getAttribute('data-i')); });
  out.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var c = e.target.closest && e.target.closest('.card'); if (!c || e.target !== c) return;
    e.preventDefault(); openModal(+c.getAttribute('data-i'));
  });
  ov.addEventListener('click', function (e) { if (!e.target.closest('.modal') || e.target.id === 'mx') closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  // ---------- 자동 동기화 (Cloudflare 배포본: config.js 에 SYNC_URL 이 있을 때만) ----------
  var live = { hash: '', busy: false, okAt: 0, err: '' };
  function clock(t) { var d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function paintSync() {
    var el = document.getElementById('syncState');
    el.textContent = live.err ? '동기화 실패 · 마지막 정상 ' + (live.okAt ? clock(live.okAt) : '없음') : live.okAt ? '마지막 동기화 ' + clock(live.okAt) : '동기화 중…';
  }
  function syncNow() {
    if (!window.SYNC_URL || live.busy) return;
    live.busy = true;
    var ctl = window.AbortController ? new AbortController() : null;
    var to = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
    fetch(window.SYNC_URL, { cache: 'no-store', credentials: 'same-origin', signal: ctl ? ctl.signal : undefined })
      .then(function (r) {
        var ct = r.headers.get('content-type') || '';
        if (r.status === 401) { location.reload(); throw new Error('로그인이 필요합니다.'); }
        if (r.redirected || ct.indexOf('json') < 0) throw new Error('로그인이 만료됐을 수 있습니다. 새로고침해 주세요.');
        if (!r.ok) throw new Error('서버 응답 오류 (' + r.status + ')');
        return r.json();
      })
      .then(function (res) {
        if (res.error) throw new Error(res.error);
        var d = res.data;
        if (d && Array.isArray(d.rows) && d.hash !== live.hash) {
          live.hash = d.hash; setData(d.rows);
          document.getElementById('updated').textContent = (d.sourceModified || d.syncedAt || '').slice(0, 16).replace('T', ' ') || '-';
          render();
        }
        live.err = ''; syncErr = ''; live.okAt = Date.now();
      })
      .catch(function (e) {
        live.err = (e && e.name === 'AbortError') ? '응답 시간 초과' : (e && e.message) || '알 수 없는 오류';
        syncErr = ROWS.length ? '' : '데이터를 불러오지 못했습니다: ' + live.err;
        if (!ROWS.length) render();
      })
      .then(function () { clearTimeout(to); live.busy = false; paintSync(); });
  }
  if (window.SYNC_URL) {
    document.getElementById('syncMeta').hidden = false;
    setInterval(function () { if (!document.hidden) syncNow(); }, window.SYNC_INTERVAL_MS || 30000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) syncNow(); });
    paintSync(); syncNow();
  }
  render();
})();
</script>
</body>
</html>
